personality = "pragmatic"
model = "gpt-5.6-sol"
model_provider = "openai"
model_reasoning_effort = "medium"
developer_instructions = """
## Purpose PDD + ADR-0000

Iron law: no behavior change without a PurposeContract and failing or stale
proof first.

PDD nine fields (mandatory for non-trivial bounded work):
purpose, consumer, contract, failureBoundary, evidence, falsifier, nonGoals,
invariants, assumptions (each `doubt=0..4` plus a falsifier).

Evidence is executable (test, command, metric, repro, live-state check, or
`[MANUAL: reviewer + scenario]`). Prose is not evidence. Do not invent system
state, command results, API behavior, or successful verification.

ADR-0000 lifecycle:
1. Capture bounded intent.
2. Translate it into a PurposeContract/PDD.
3. Research missing context and expose assumptions.
4. Run-control: risk, doubt, reversibility, blast radius, cost, approval.
5. Map to the Feature Tree and generate a WorkSpec.
6. Contract tests or executable evidence before implementation.
7. Smallest satisfying change.
8. Verify tests, quality, runtime, deployment, and falsifier evidence.
9. Persist an EvidenceBundle, close the work, scoped learning.

Cosmetic self-contained work with no behavior, policy, proof, consumer, or
public-contract impact is out of scope. Everything else is in.

Load `using-skills`, then `purpose-first`. Full doctrine:
`~/.agents/skills/purpose-first/SKILL.md`. ADR:
`docs/adr/0000-purpose-to-software-fabric.md` in singularity-engine.

Done: named purpose, named consumer, proof run (failed first for a behavior
change), evidence on disk, named falsifier.

## Subagent routing

At every `spawn_agent` call, select and state the least-cost capable model and
reasoning effort. Use Luna/low for mechanical audits, inventory, and schema or
format validation; Terra/medium for bounded implementation, source tracing,
and integration diagnosis; Sol or Astra only for architecture, adversarial
review, or unresolved doubt of 2 or higher. Never silently use the default
model for delegated work.
"""
web_search = "disabled"
sandbox_mode = "danger-full-access"
approval_policy = "never"
suppress_unstable_features_warning = true

[projects."/home/mhugo/code/unity"]
trust_level = "trusted"

[projects."/home/mhugo/code/singularity-ng/vectordrive"]
trust_level = "trusted"

[projects."/home/mhugo/code/dr-repo"]
trust_level = "trusted"

[notice]
hide_full_access_warning = true

[features]
context_management = true
step_model_switching = true
mcp_2026_07_28 = true
# Short MCP server key + non-prefixed tool names: the gateway tool names
# (server__tool) must stay within the 64-char Responses API bound even
# after codex adds its client prefix; the long deployment-name key
# pushed 8 of 88 names over the limit (2026-09-08).
non_prefixed_mcp_tool_names = { enabled = true, server_names = ["ccgw"] }
# Codex's own on-disk memory store is off: durable agent memory belongs in the
# repo_memory bank reached through the CentralCloud MCP gateway, not in a
# per-client store no other tool can read, supersede, or purge.
# ~/.codex/memories/skills and ~/.codex/memories/.agents are the authored
# instruction plane and are unaffected by this flag.
memories = false
unified_exec = true
shell_snapshot = true
multi_agent = true
steer = true
personality = true
undo = true
apply_patch_freeform = true
remote_models = true
collaboration_modes = true
js_repl = true
prevent_idle_sleep = true

[features.multi_agent_v2]
enabled = false
hide_spawn_agent_metadata = false
max_concurrent_threads_per_session = 6
multi_agent_mode_hint_text = "Proactive multi-agent delegation is active for the root agent. The root should use sub-agents when independent parallel work would materially improve speed or quality. Spawned sub-agents must not create further sub-agents unless the parent explicitly assigns a bounded nested decomposition."
tool_namespace = "agents"

[agents]
max_depth = 2

# Resident subagents carry opaque Responses items and therefore stay on the
# OpenAI provider. Gateway models are profile-only and run in fresh processes.
[agents.default]
description = "Balanced general-purpose subagent (GPT-5.6 Terra): bounded mixed work that does not match a narrower specialist."
config_file = "agents/default.toml"

[agents.taxonomy_worker]
description = "Taxonomy discovery worker (GPT-5.6 Terra): source extraction, clustering, normalization, and boundary proposals."
config_file = "agents/taxonomy-worker.toml"

[agents.taxonomy_validator]
description = "Mechanical taxonomy validator (GPT-5.6 Luna): labeling, duplicate detection, schema checks, and format validation."
config_file = "agents/taxonomy-validator.toml"

[agents.singularity_engine_harvester]
description = "Singularity Engine harvester (GPT-5.6 Terra): source-grounded architecture and capability harvesting from donor systems."
config_file = "agents/singularity-engine-harvester.toml"

[agents.scout]
description = "Read-only scout (GPT-5.6 Luna): mechanical inventory, structural audit, and bounded evidence collection."
config_file = "agents/scout.toml"

[agents.implementer]
description = "Bounded implementer (GPT-5.6 Terra): path-owned implementation and focused verification."
config_file = "agents/implementer.toml"

[agents.reviewer]
description = "Adversarial reviewer (GPT-5.6 Sol): architectural review, risk analysis, and evidence challenge."
config_file = "agents/reviewer.toml"

# Belt and braces alongside [features].memories: never generate new local
# memories, never read the existing ones back into context.
[memories]
use_memories = false
generate_memories = false

[mcp_servers.ccgw]
url = "http://mcp-gateway.svc/mcp"
required = true

[model_providers.llm-gateway]
name = "CentralCloud LLM Gateway"
base_url = "http://llm-gateway.svc:80/codex/v1"
env_key = "LLM_MUX_API_KEY"
wire_api = "responses"

# history.jsonl safety cap. NOTE: this governs ONLY history.jsonl -- codex has
# no retention whatsoever for the ~/.codex/sessions rollout files, which grow
# unbounded (12.8 GB / 4.6k files observed on the devbox 2026-08-08).
[history]
persistence = "save-all"
max_bytes = 104857600

# Native OTLP export, replacing the former ~/.local/bin/codex OTEL wrapper.
# OTLP/HTTP endpoints are signal-specific: logs and traces must use their
# respective /v1 paths. The collector returns 404 at its root.
# Verified accepted by `codex exec --strict-config` (which rejects unknown
# fields). exporter MUST be the struct form -- the bare string "otlp-http" is
# rejected: "invalid type: unit variant, expected struct variant".
[otel]
environment = "devbox"
log_user_prompt = false
exporter = {otlp-http = {endpoint = "http://otel-collector.monitoring.svc.cluster.local:4318/v1/logs", protocol = "binary", headers = {}}}
trace_exporter = {otlp-http = {endpoint = "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces", protocol = "binary", headers = {}}}
