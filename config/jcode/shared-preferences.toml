[provider]
# Default workhorse: MiniMax-M3 via api.minimax.io (minimax-direct).
# Umans routes are retired for default/session traffic.
default_provider = "minimax-direct"
default_model = "minimax-direct:MiniMax-M3"
model_picker_providers = ["minimax-direct", "llm-gateway", "kimi", "openai-oauth", "ollama-cloud", "byteplus-ark"]
cross_provider_failover = "countdown"

# jcode's own memory agent is off. Durable agent memory belongs in the
# repo_memory bank reached through the CentralCloud MCP gateway; a per-client
# store is invisible to every other coding client, so a fact learned here is
# re-learned or contradicted in Codex, Claude Code, or Qoder. This gates the
# WRITE path, not just recall: crates/jcode-app-core/src/server.rs only spawns
# memory_agent::init() when features.memory is true, so nothing new accumulates.
# Do NOT substitute agents.memory_sidecar_enabled -- that only falls back to the
# no-LLM hybrid path and writes continue.
[features]
memory = false

[auth]
trusted_external_sources = []
trusted_external_source_paths = []

[providers.llm-gateway]
type = "open-ai-compatible"
base_url = "https://llm-gateway.centralcloud.com/v1"
auth = "bearer"
api_key_env = "JCODE_PROVIDER_LLM_GATEWAY_API_KEY"
env_file = "provider-llm-gateway.env"
default_model = "auto"
requires_api_key = true
provider_routing = false
allow_provider_pinning = false
model_catalog = true

[[providers.llm-gateway.models]]
id = "auto"

# Do not call this profile "minimax": J-Code's built-in minimax profile wins
# that prefix and may select its key-prefix based China endpoint.  This named
# profile is the direct international route and remains distinct from the
# CentralCloud gateway fallback.
[providers.minimax-direct]
type = "open-ai-compatible"
base_url = "https://api.minimax.io/v1"
auth = "bearer"
api_key_env = "MINIMAX_API_KEY"
env_file = "minimax-direct.env"
default_model = "MiniMax-M3"
requires_api_key = true
provider_routing = false
allow_provider_pinning = false
model_catalog = true

[[providers.minimax-direct.models]]
id = "MiniMax-M3"

# Direct ollama.com cloud provider — full context + reasoning, unlike the
# llm-gateway ollama-cloud/* entries which are cataloged at 128k/no-reasoning.
# The autonomy model-admission policy routes ollama-cloud:glm-5.2 (coordinator
# failover) and ollama-cloud:deepseek-v4-flash (explore/worker) through this
# provider; without it, worker spawn fails and pending effects block all
# autonomous dispatch.
[providers.ollama-cloud]
type = "open-ai-compatible"
base_url = "https://ollama.com/v1"
auth = "bearer"
api_key_env = "OLLAMA_API_KEY"
env_file = "ollama-cloud.env"
default_model = "glm-5.2"
requires_api_key = true
provider_routing = false
allow_provider_pinning = false
model_catalog = true

[[providers.ollama-cloud.models]]
id = "glm-5.2"

[[providers.ollama-cloud.models]]
id = "deepseek-v4-flash"

# Enable repository lane provisioning for autonomous swarm dispatch. Without
# this, the autonomy controller cannot create isolated writer workspaces for
# managed canonical-primary repos (e.g. jcode selfdev), and lane provisioning
# fails with "refusing to fall back the worker cwd onto it".
[agents]
swarm_lane_provisioning = true

# BytePlus Ark coding plan (ap-southeast-1). OpenAI protocol: jcode only
# supports open-ai-compatible / open-router, so this uses Ark's
# /api/coding/v3 rather than its Anthropic-protocol /api/coding path.
# model_catalog stays false on purpose: Ark's /models publishes 54 regional
# models, most of which the coding-plan key is NOT entitled to, and a live
# catalog would let the picker select one that 404s with UnsupportedModel.
# Every id below was verified against the live endpoint on 2026-08-12.
[providers.byteplus-ark]
type = "open-ai-compatible"
base_url = "https://ark.ap-southeast.bytepluses.com/api/coding/v3"
auth = "bearer"
api_key_env = "BYTEPLUS_ARK_API_KEY"
env_file = "byteplus-ark.env"
default_model = "ark-code-latest"
requires_api_key = true
provider_routing = false
allow_provider_pinning = false
model_catalog = false

# ark-code-latest is the console-side Auto router; it reports model = "auto"
# and rejects image input. Context is the conservative pool floor.
[[providers.byteplus-ark.models]]
id = "ark-code-latest"
context_window = 262144
input = ["text"]

[[providers.byteplus-ark.models]]
id = "dola-seed-2.0-pro"
context_window = 262144
input = ["text", "image"]

[[providers.byteplus-ark.models]]
id = "dola-seed-2.0-lite"
context_window = 262144
input = ["text", "image"]

[[providers.byteplus-ark.models]]
id = "dola-seed-2.0-code"
context_window = 262144
input = ["text", "image"]

[[providers.byteplus-ark.models]]
id = "glm-5.2"
context_window = 1048576
input = ["text"]

[[providers.byteplus-ark.models]]
id = "glm-5.1"
context_window = 200000
input = ["text"]

[[providers.byteplus-ark.models]]
id = "kimi-k2.5"
context_window = 262144
input = ["text"]

[[providers.byteplus-ark.models]]
id = "gpt-oss-120b"
context_window = 131072
input = ["text"]
