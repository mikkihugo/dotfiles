[provider]
# Global default session route; provider-local defaults are intentionally unset.
default_provider = "minimax"
default_model = "minimax:MiniMax-M3"
model_picker_providers = ["minimax", "kimi", "openai-oauth", "ollama-cloud"]
cross_provider_failover = "countdown"

# jcode's own memory agent is off. Durable agent memory belongs in the
# repo_memory bank reached through the CentralCloud MCP gateway; a per-client
# store is invisible to every other coding client, so a fact learned here is
# re-learned or contradicted in Codex, Claude Code, or Qoder. This gates the
# WRITE path, not just recall: crates/jcode-app-core/src/server.rs only spawns
# memory_agent::init() when features.memory is true, so nothing new accumulates.
# Do NOT substitute agents.memory_sidecar_enabled -- that only falls back to the
# no-LLM hybrid path and writes continue.
[features]
memory = false

[auth]
trusted_external_sources = []
trusted_external_source_paths = []

# Direct ollama.com cloud provider — full context + reasoning, unlike the
# llm-gateway ollama-cloud/* entries which are cataloged at 128k/no-reasoning.
# The autonomy model-admission policy routes ollama-cloud:glm-5.3 (coordinator
# failover) and ollama-cloud:deepseek-v4-flash (explore/worker) through this
# provider; without it, worker spawn fails and pending effects block all
# autonomous dispatch.
[providers.ollama-cloud]
type = "open-ai-compatible"
base_url = "https://ollama.com/v1"
auth = "bearer"
api_key_env = "OLLAMA_API_KEY"
env_file = "ollama-cloud.env"
requires_api_key = true
provider_routing = false
allow_provider_pinning = false
model_catalog = true

[[providers.ollama-cloud.models]]
id = "glm-5.3"

[[providers.ollama-cloud.models]]
id = "deepseek-v4-flash"

# Enable repository lane provisioning for autonomous swarm dispatch. Without
# this, the autonomy controller cannot create isolated writer workspaces for
# managed canonical-primary repos (e.g. jcode selfdev), and lane provisioning
# fails with "refusing to fall back the worker cwd onto it".
[agents]
swarm_lane_provisioning = true
