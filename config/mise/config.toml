[tool_alias]
# mise manages itself: the nixpkgs build ships lib/mise/.disable-self-update and
# the Nix store is read-only, so `mise self-update` can never replace the
# binary. The nixpkgs copy stays the bootstrap (it is what installs the first
# mise-managed copy); from then on `mise upgrade` keeps the managed one current
# without a flake bump. The bare `mise` shorthand is not in the mise registry,
# so the alias names the upstream GitHub release backend explicitly.
mise = "github:jdx/mise"

[tools]
# mise itself is a managed tool, so `mise upgrade` (run by the
# mise-auto-update systemd user timer) updates it like droid, node and awscli.
mise = "latest"
# codex: managed by the official npm package (`npm i -g @openai/codex`,
# ~/.npm-global/bin/codex), not mise. The aqua registry ships only the bare
# `codex` binary from 0.146.0 onward and drops the `codex-code-mode-host`
# sidecar, which makes every shell/exec tool call inside Codex fail with
# "failed to spawn code-mode host ... (os error 2)". The npm platform
# package @openai/codex-linux-x64 vendors codex + codex-code-mode-host.
"npm:@moonshot-ai/kimi-code" = "latest"
"github:aaif-goose/goose" = "latest"
# ACP adapter so goose can use Claude Code as provider `claude-acp`.
"npm:@agentclientprotocol/claude-agent-acp" = "latest"
# Qoder CLI is not in the mise registry; pin the OSS release tarball (http backend).
"http:qodercli" = { version = "1.1.1", url = "https://qoder-ide.oss-accelerate.aliyuncs.com/qodercli/releases/1.1.1/qodercli-linux-x64.tar.gz", checksum = "sha256:21b60e3d0d9db9c35e5385c6d9523628e18735b7be5bbbc1a91996e4ed6a2b2a" }
"github:vinhnx/vtcode" = "latest"
# Node is pinned to 26 below, matching the Engine and Hightower repo pins.
# Copilot CLI: unpinned (2026-10-24). The old "1.0.83 hook regression" pin was
# a false premise — the installed binary was already 1.0.103, because copilot's
# own `copilot update` rewrote the binary in place on 2026-10-22 and left the
# mise install dir named 1.0.82 with a stale lockfile. Logs show hooks firing
# under 1.0.103 and zero "No hooks loaded" events; upstream 1.0.88 fixed hook
# cwd resolution and session-start hook merging.
# 1.0.103+ is required for the copilot-volume / copilot-strong helpers in
# shell/bash/bashrc: COPILOT_ENABLE_ALT_PROVIDERS / COPILOT_AGENT_MODEL
# (multi-model BYOK). Those vars exist from 1.0.92-4 onward, but 1.0.103 is
# the version this host resolves and is what the helpers were written against.
"npm:@github/copilot" = "latest"
"npm:@hrrrsn/mcp-vnc" = "latest"
# 0.0.80 lost npm provenance vs 0.0.40-0.0.79 (mise's trust-policy correctly
# flagged it) - verified benign: Microsoft's publish.yml moved npm publishing
# from GitHub-Actions-OIDC to their internal Azure DevOps ESRP pipeline for
# this one release (real GitHub release by the known maintainer, PR-linked
# changelog, matching tag/commit/timeline); the OIDC job was already restored
# at HEAD as of 2026-09-07. Scoped to this exact version, not a blanket
# disable - remove once a future version regains provenance.
"npm:@playwright/mcp" = { version = "latest", trust_policy_excludes = ["@playwright/mcp@0.0.80", "playwright@1.63.0-alpha-2026-08-31", "playwright-core@1.63.0-alpha-2026-08-31"] }
gcloud = "latest"
"npm:firebase-tools" = "latest"
# Python is NOT managed by mise: Home Manager + flake.nix ship nixpkgs python3.
# The mise-built interpreter could not import bz2 (libbz2.so.1 dlopen miss) and
# sat ahead of nixpkgs on PATH via shims. Uninstalled by activation.
java = "latest"
crush = "latest"
# Rust is NOT managed by mise anymore: the fleet-wide nix-managed toolchain
# (hosts/_shared/rust-toolchain.nix in /srv/infra, pinned to the engine's
# nixpkgs 1.95.0) replaced the rustup/mise proxies on 2026-09-08 after the
# GC'd-interpreter incident. cargo/rustc/rustfmt resolve from the system
# profile; the mise rust toolchains and shims were uninstalled.
"github:contabo/cntb" = "latest"
"github:ovh/ovhcloud-cli" = "latest"
awscli = { version = "latest", symlink_bins = "true" }
# claude: managed by the native installer (~/.local/bin/claude, auto-updating), not mise.
claude-squad = "latest"
"npm:@kilocode/cli" = "latest"
"npm:droid" = "latest"
azure-cli = { version = "latest", uvx_args = "--prerelease=allow" }
"pipx:nanobot-ai" = "latest"
"npm:wrangler" = "latest"
# oci: pinned — both registry backends are broken on mise 2026.8.6 (asdf plugin
# lacks bin/list-all; vfox:jdx/vfox-oci crashes in post_install.lua). 3.90.3 is
# installed and working; bump manually after checking the plugin is fixed.
oci = "3.90.3"
vultr-cli = "latest"
"pipx:b2" = "latest"
# gogcli: renamed upstream from steipete/gogcli to openclaw/gogcli
"go:github.com/openclaw/gogcli/cmd/gog" = "latest"
ollama = "0.32.14"
node = "26.11.1"
pnpm = "12.9.0"
# jcode: managed by CI deploy + auto-deploy timer (~/.jcode/server/jcode), not mise.

[env]
# kimi-code reads this from process.env (resolveCompletionBudget) — it is NOT a
# kimi-code config.toml key, and the `kimi` launcher is a compiled binary. Caps
# compaction (and turn) max_completion_tokens below provider output limits, which
# fixes the compaction APIContextOverflowError on non-clamping providers like
# ollama-cloud. 32768 is safe across the configured model set; raise toward 65536
# if you only use models whose real output limit is >= 131072 (e.g. devstral-2:123b).
# See MoonshotAI/kimi-code PR #829.
KIMI_MODEL_MAX_COMPLETION_TOKENS = "32768"

[settings]
yes = true
# Auto-trust mise config files in own repos (covers git worktrees, which
# otherwise prompt per-path on every new worktree).
trusted_config_paths = ["/home/mhugo/code", "/home/mhugo/.dotfiles"]
minimum_release_age = "1h"
all_compile = false
