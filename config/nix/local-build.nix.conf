# Nix user configuration — shared devbox builder pool.
#
# Default for this workstation: do not build locally. Builds go to
# cc-de-nue-k3s-02, cc-fi-hel-k3s-02, and cc-de-fsn-k3s-01. Builders pull substitutes so they reuse
# cache.flakecache.com/default before compiling. Cache uploads are owned by the
# system-level NixOS post-build hook, not this user nix.conf.
#
# Single fleet cache URL only. cache.centralcloud.com/default is a DNS alias to
# the same backend — do not list both substituters. sccache uses the same host
# under /default/sccache/... (see shell/bash/bashrc).

extra-experimental-features = nix-command flakes
extra-substituters = https://cache.flakecache.com/default
extra-trusted-public-keys = default:ESyvaQTiq681JA0iaH5tsQWS+R5qqJUVdVY1OXbi9to=

# Remote builders are the default (max-jobs = 0).
# cc-de-fsn-k3s-01 is the Falkenstein k3s worker (16 cores, max-jobs = auto).
#
# Voter guard (infra#2083): do not add cc-de-fsn-core-01, cc-de-nue-k3s-01,
# cc-fi-hel-core-01, cc-fr-lau-store-02, or cc-se-sto-core-01. The builder
# set is cc-de-nue-k3s-02, cc-fi-hel-k3s-02, and cc-de-fsn-k3s-01.
max-jobs = 0
builders = ssh-ng://root@cc-de-nue-k3s-02 x86_64-linux /home/mhugo/.ssh/personal_admin_id_ed25519 12 1 benchmark,big-parallel,kvm,nixos-test ; ssh-ng://root@cc-fi-hel-k3s-02 x86_64-linux /home/mhugo/.ssh/personal_admin_id_ed25519 16 1 benchmark,big-parallel,kvm,nixos-test ; ssh-ng://root@cc-de-fsn-k3s-01 x86_64-linux /home/mhugo/.ssh/personal_admin_id_ed25519 16 1 benchmark,big-parallel,kvm,nixos-test
builders-use-substitutes = true

# `auto-optimise-store` is deliberately NOT set here. It is a host-level policy
# owned by the fleet NixOS configuration in centralcloud/infra
# (hosts/cc-se-sto-devbox-01/etc/nixos/configuration.nix, and
# hosts/_shared/nix-cache.nix). A value here silently overrides the system one
# because the user config wins — which is how this file previously contradicted
# the host policy. Machines with no host-level policy fall back to their own OS
# default.
keep-derivations = false
keep-outputs = false
max-substitution-jobs = 16

# jj uses git as backend; working copy is never "clean" in git terms — suppress the warning
warn-dirty = false

# Accept flake nixConfig settings without interactive prompts.
# Flake fallback=true requires trust to apply; without this Nix hard-fails on cache 502s.
accept-flake-config = true
fallback = true
connect-timeout = 5
