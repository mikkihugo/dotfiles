# Nix user configuration — shared devbox builder pool.
#
# Default for this workstation: do not build locally. Builds go to
# cc-fr-lau-0002 (89.117.63.169, also the Hydra builder) first, then
# cc-fi-hel-k3s-02 (89.167.50.230). Builders pull substitutes so they reuse
# cache.flakecache.com/default before compiling. Cache uploads are owned by the
# system-level NixOS post-build hook, not this user nix.conf.
#
# Single fleet cache URL only. cache.centralcloud.com/default is a DNS alias to
# the same backend — do not list both substituters.

extra-experimental-features = nix-command flakes
extra-substituters = https://cache.flakecache.com/default
extra-trusted-public-keys = default:ESyvaQTiq681JA0iaH5tsQWS+R5qqJUVdVY1OXbi9to=

# Remote builders are the default (max-jobs = 0).
# cc-de-nue-k3s-02 is out: SSH login succeeds and the session never starts.
# cc-de-fsn-k3s-01 is out (DiskPressure 2026-11-26). cc-fi-hel-k3s-02 keeps
# 4 jobs so cc-fr-lau-0002 (14 cores, ZFS) takes most builds.
#
# Voter guard (infra#2083): do not add cc-de-fsn-core-01, cc-de-nue-k3s-01,
# cc-fi-hel-core-01, cc-fr-lau-store-02, or cc-se-sto-core-01.
max-jobs = 0
builders = ssh-ng://root@89.117.63.169 x86_64-linux /home/mhugo/.ssh/personal_admin_id_ed25519 6 2 benchmark,big-parallel,kvm,nixos-test ; ssh-ng://root@89.167.50.230 x86_64-linux /home/mhugo/.ssh/personal_admin_id_ed25519 4 1 benchmark,big-parallel,kvm,nixos-test
builders-use-substitutes = true

# Hard-link identical store files. Same value as the devbox NixOS host.
auto-optimise-store = true
# Retain derivations so the Nix eval-cache can reuse recorded drv paths across
# separate gate invocations; the host daemon already requires this invariant.
keep-derivations = true
keep-outputs = false
max-substitution-jobs = 16

# jj uses git as backend; working copy is never "clean" in git terms — suppress the warning
warn-dirty = false

# Accept flake nixConfig settings without interactive prompts.
# Flake fallback=true requires trust to apply; without this Nix hard-fails on cache 502s.
accept-flake-config = true
fallback = true
connect-timeout = 5
