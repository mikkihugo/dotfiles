# Nix user configuration — shared devbox builder pool.
#
# Default for this workstation: build locally and fan out heavy Linux builds to
# the first two healthy fleet builders. Builders pull substitutes so they reuse
# cache.flakecache.com/default before compiling. Cache uploads are owned by the
# system-level NixOS post-build hook, not this user nix.conf.
#
# Single fleet cache URL only. cache.centralcloud.com/default is a DNS alias to
# the same backend — do not list both substituters. sccache uses the same host
# under /default/sccache/... (see shell/bash/bashrc).

extra-experimental-features = nix-command flakes
extra-substituters = https://cache.flakecache.com/default
extra-trusted-public-keys = default:ESyvaQTiq681JA0iaH5tsQWS+R5qqJUVdVY1OXbi9to=

# Local builds plus an eligible non-voter remote builder.
#
# Voter guard (infra#2083): never add an etcd voter to this list. The
# prohibited voter set includes cc-de-fsn-core-01, cc-de-nue-k3s-01,
# cc-de-nue-k3s-02, cc-fi-hel-core-01, cc-fr-lau-store-02, and
# cc-se-sto-core-01; verify it against live etcd membership and
# /srv/infra/scripts/etcd-voters.list before changing this file. The retained
# builder, 89.167.50.230 (cc-fi-hel-k3s-02), is a non-voter worker.
builders = ssh-ng://root@89.167.50.230 x86_64-linux /home/mhugo/.ssh/personal_admin_id_ed25519 16 1 benchmark,big-parallel,kvm,nixos-test
builders-use-substitutes = true

# Store-wide hard-link optimisation can exhaust ext4's per-inode link limit.
auto-optimise-store = false
keep-derivations = false
keep-outputs = false
max-substitution-jobs = 16

# jj uses git as backend; working copy is never "clean" in git terms — suppress the warning
warn-dirty = false

# Accept flake nixConfig settings without interactive prompts.
# Flake fallback=true requires trust to apply; without this Nix hard-fails on cache 502s.
accept-flake-config = true
fallback = true
connect-timeout = 5
